name: svf-build

# CI-only variant for ci/validate-* branches on ExcitedSpider/SVF: the same
# build and ctest steps as upstream svf-build, run on the self-hosted runners
# against the matching ExcitedSpider/Test-Suite branch.
on:
  push:
    branches: [ 'ci/validate-*' ]

env:
  SVF_CTIR: 1
  SVF_Z3: 1
  SVF_DIR: $GITHUB_WORKSPACE

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: [self-hosted, macOS, ARM64]
          - name: linux-x64
            runner: [self-hosted, Linux, X64]
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - name: select-test-suite-branch
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            ci/validate-1955)   ts=test/ae-unknown-size-gep ;;
            ci/validate-1958)   ts=test/ae-strcpy-joined-length ;;
            ci/validate-1960)   ts=test/ae-entry ;;
            ci/validate-master) ts=ci/combined-tests ;;
            *) echo "no Test-Suite branch for ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          echo "TEST_SUITE_BRANCH=$ts" >> "$GITHUB_ENV"

      - name: tool-versions
        shell: bash
        run: |
          uname -a
          for t in git cmake ninja make cc c++ curl xz brew; do printf '%-6s ' "$t"; command -v "$t" || echo missing; done

      - name: linux-setup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Same development packages upstream CI installs in ubuntu-setup.
          pkgs="zlib1g-dev libzstd-dev libxml2-dev libncurses-dev"
          if dpkg -s $pkgs >/dev/null 2>&1; then echo "already installed: $pkgs"; exit 0; fi
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo -n"
          $SUDO apt-get update -qq && $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $pkgs \
            || { echo "::error::cannot install $pkgs on this runner (needs root or passwordless sudo)"; exit 1; }

      - name: build-svf
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 -b "$TEST_SUITE_BRANCH" https://github.com/ExcitedSpider/Test-Suite.git Test-Suite
          git -C Test-Suite log --oneline -1
          source "$GITHUB_WORKSPACE/build.sh"

      - name: ctest
        shell: bash
        working-directory: ${{github.workspace}}/Release-build
        run: |
          failed=""
          for f in objtype wpa_tests dvf_tests mta_tests diff_tests-ander diff_tests-fs diff_tests-wr-ander \
                   mem_leak double_free symabs ae_assert_test ae_overflow_test ae_nullptr_deref_tests \
                   ae_recursion_tests ae_no_main semi_sparse ae_full_sparse ae_entry cfl_tests \
                   diff-perf-cruxbc-big diff-perf-cruxbc-small; do
            echo "::group::ctest -R $f"
            # Serial, as upstream: diff_tests-wr-ander writes then reads files.
            ctest -R "$f" --output-on-failure || failed="$failed $f"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed filters:$failed"; exit 1; fi
